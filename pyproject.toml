[project]
name = "byof-agent"
version = "1.0.1"
description = "BYOF Agent (Bring Your Own Factory Agent): production planning and exception management agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "ortools==9.15.6755",
    "psycopg[binary]==3.3.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.54",
    "uvicorn[standard]==0.53.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["packages/**/*.py", "services/**/*.py", "tests/**/*.py", "scripts/**/*.py", "database/migrations/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["packages", "services", "scripts"]
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests", "database/tests"]
pythonpath = ["."]
addopts = "-ra --tb=short"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "ruff==0.16.7",
]
