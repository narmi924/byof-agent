<style>
  /* 7 s cycle: paper 0–40 %, wipe to ink 40–50 %, ink 50–90 %, wipe to paper 90–100 %; every wipe eases in and out */
  .toInk   { r: 0px;   animation: toInk   7s cubic-bezier(.65,0,.35,1) infinite; }
  .toPaper { r: 0px;   animation: toPaper 7s cubic-bezier(.65,0,.35,1) infinite; }
  .turn    { transform-box: fill-box; transform-origin: center; animation: turn 7s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes toInk   { 0%,40% { r: 0px } 50%,100% { r: 478px } }
  @keyframes toPaper { 0%,90% { r: 0px } 100% { r: 478px } }
  @keyframes turn    { 0%,40% { transform: rotate(0deg) } 50%,90% { transform: rotate(40deg) } 100% { transform: rotate(80deg) } }
  @media (prefers-reduced-motion: reduce) { .toInk, .toPaper, .turn { animation: none } }
</style>
